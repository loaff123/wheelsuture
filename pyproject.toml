[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelsuture"
version = "0.1.0a1"
description = "Offline wheel-transition rehearsal with causal payload evidence and verified repair proposals"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md", "licenses/*"]
authors = [{name = "WheelSuture contributors"}]
dependencies = ["packaging>=26.3,<27"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.scripts]
wheelsuture = "wheelsuture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wheelsuture = ["schemas/*.json", "examples/*.json", "examples/wheels/*/*.whl"]
